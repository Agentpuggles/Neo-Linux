version: 2
updates:
  # Keep workflow actions current. AppImage dependencies/tool hashes are reviewed
  # together with their license references; see docs/appimage.md.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
