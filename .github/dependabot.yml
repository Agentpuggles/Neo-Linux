version: 2
updates:
  # The launcher has no dependencies to update — the workflow files are the only
  # third-party code that runs on our behalf, so those get the refresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
