name: Bug report
description: A command does the wrong thing, crashes, or refuses to work
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the details — this launcher talks to a live service and to Proton, so
        the specifics are what make a report fixable.

        **Before you file:** check the
        [troubleshooting table](https://github.com/Agentpuggles/Neo-Linux/blob/main/README.md#troubleshooting)
        and [docs/engineering-notes.md](https://github.com/Agentpuggles/Neo-Linux/blob/main/docs/engineering-notes.md) —
        several failure modes (email/password screen, `Failed to open descriptor file`,
        transient 404s from the CDN) already have known answers.

        **Never paste:** `~/.local/share/neo/auth.json`, an access/refresh token, or an
        exchange code from `neo launch`. Redact them; they are credentials.
  - type: dropdown
    id: command
    attributes:
      label: Which command failed?
      options:
        - login
        - setup
        - status
        - list
        - install
        - verify
        - launch
        - config
        - other / several
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The exact output is more useful than a summary. Copy the last ~20 lines.
      placeholder: |
        $ neo install 10.40
        Build: ++Fortnite+Release-10.40-CL-9380822  (61.9 GiB)
        ...
        ✖ chunk 1832294A440167B074AC75B6A842F82A: HTTP 404
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: Including what you had already tried, and whether it worked before.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. neo logout
        2. neo login            # callback never fires
        3. neo whoami           # ✖ not logged in
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Copy-paste ready output of `neo --version`, `python3 -V`, and your distro / umu / Proton versions.
      value: |
        - neo: 
        - Python: 
        - Distribution: 
        - umu-launcher: 
        - Proton build: 
        - Filesystem / free space on the install drive: 
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes / intermittent
        - Once, never again
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and the troubleshooting table for this symptom
          required: true
        - label: I removed any token, session file or exchange code from what I pasted
          required: true
        - label: I am running the current release (`neo --version`) or can say which version I use
          required: true
